name: Proposal
description: A change to discuss before it is built, such as to the requirement text, a format, an exported API or a dependency.
labels: [proposal]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change you propose.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, and for whom.
    validations:
      required: true
