name: Bug
description: Placket did something it should not, or failed to do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A security problem goes to SECURITY.md, never here.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The commands or code, and their output. Leave out keys, salts and bodies.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or tag, and the Go version and operating system.
    validations:
      required: true
