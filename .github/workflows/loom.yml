# Loom's checks on a product repository: `red-green-tests` and `ci`. Landed and changed only by the
# maintainer's merge; the writer's App has no workflows permission.
#
# red-green-tests (pull requests, drafts included, and pushes to main): every test the change adds or
#       changes fails at the merge base with main and passes at the head, and no test is removed or
#       skipped unexplained (AGENTS.md, red-green-tests; docs/adr/0013-red-green-tests.md). It runs
#       tools/redgreen built from main's copy, never the branch's.
# ci   (pull requests, drafts included, and pushes to main): `make ci` passes at the head. Required on main.
name: loom
on:
  push:
    branches: [main]
  # A branch is checked through its pull request, so one push runs each job once. No job is skipped
  # by `if:`: a skipped job reports Success even as a required check.
  pull_request:
permissions:
  contents: read
# A push to a pull request ends the run of the commit it replaces: only the head's result is read,
# and the old run would hold a runner the new one waits for. A push to main is never cancelled: each
# commit of main keeps its own run.
concurrency:
  group: loom-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GO_VERSION: "1.27.4"
  # Go's module and build caches, which hold the standard library built plain and for the race
  # detector, each module's packages, and the pinned tools make ci runs with `go run`. Every job
  # restores the newest that main saved; only the ci job of a push to main saves one, under its
  # commit, so a pull request reads main's cache and can never write what main or another pull
  # request reads. Test results never come from it: make ci and redgreen run go test with -count=1.
  GO_CACHE_PATHS: |
    ~/.cache/go-build
    ~/go/pkg/mod
jobs:
  red-green-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Every branch, so origin/main and the merge base are here without a fetch that needs the token.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Its own cache is keyed on go.sum alone, so it is saved once and never again; the step
          # below restores main's (GO_CACHE_PATHS).
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-
      - name: Tests are red at the merge base with main and green at the head
        shell: bash
        env:
          # The pull request's opener, for outside-commits-signed-off (docs/rules/changes.md): an
          # outside pull request's commits need their authors' sign-off, Dependabot's are exempt, and
          # the project's need none. Empty on a push to main, where only a bot's sign-off is refused.
          PLACKET_PR_OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          if ! git cat-file -e origin/main:tools/redgreen/go.mod 2>/dev/null; then
            echo "red-green-tests: not on main yet"; exit 0
          fi
          # main's copy, so a change cannot alter the check that judges it.
          git worktree add --quiet --detach "$RUNNER_TEMP/main" origin/main ||
            { echo "::error::red-green-tests: no worktree of origin/main"; exit 3; }
          (cd "$RUNNER_TEMP/main/tools/redgreen" && go build -o "$RUNNER_TEMP/redgreen" .) ||
            { echo "::error::red-green-tests: tools/redgreen on main does not build"; exit 3; }
          git worktree remove --force "$RUNNER_TEMP/main"
          base=$(git merge-base origin/main HEAD) ||
            { echo "::error::red-green-tests: no merge base of origin/main and HEAD"; exit 3; }
          # 0 ok, 1 refused, 3 could not judge; anything but 0 fails the job.
          "$RUNNER_TEMP/redgreen" "$base" HEAD
  ci:
    # make ci runs its steps, its modules' tests and its shell tests side by side, so it needs four
    # processors: a standard runner has four in a public repository, and two in a private one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Its own cache is keyed on go.sum alone, so it is saved once and never again; the step
          # below restores main's (GO_CACHE_PATHS).
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-
      - run: make ci
      - if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ github.sha }}
