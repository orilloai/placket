# Loom's checks on a product repository: `red-green-tests` and `ci`. Landed and changed only by the
# maintainer's merge; the writer's App has no workflows permission.
#
# red-green-tests (pull requests, drafts included, and pushes to main): every test the change adds or
#       changes fails at the merge base with main and passes at the head, and no test is removed or
#       skipped unexplained (AGENTS.md, red-green-tests; docs/adr/0013-red-green-tests.md). It runs
#       tools/redgreen built from main's copy, never the branch's.
# ci   (pull requests, drafts included, and pushes to main): `make ci` passes at the head. Required on main.
name: loom
on:
  push:
    branches: [main]
  # A branch is checked through its pull request, so one push runs each job once. No job is skipped
  # by `if:`: a skipped job reports Success even as a required check.
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
jobs:
  red-green-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Every branch, so origin/main and the merge base are here without a fetch that needs the token.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Go's module and build caches, keyed on every module's go.sum (there is none at the root).
          # Test results never come from it: redgreen runs go test with -count=1.
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: Tests are red at the merge base with main and green at the head
        shell: bash
        run: |
          set -uo pipefail
          if ! git cat-file -e origin/main:tools/redgreen/go.mod 2>/dev/null; then
            echo "red-green-tests: not on main yet"; exit 0
          fi
          # main's copy, so a change cannot alter the check that judges it.
          git worktree add --quiet --detach "$RUNNER_TEMP/main" origin/main ||
            { echo "::error::red-green-tests: no worktree of origin/main"; exit 3; }
          (cd "$RUNNER_TEMP/main/tools/redgreen" && go build -o "$RUNNER_TEMP/redgreen" .) ||
            { echo "::error::red-green-tests: tools/redgreen on main does not build"; exit 3; }
          git worktree remove --force "$RUNNER_TEMP/main"
          base=$(git merge-base origin/main HEAD) ||
            { echo "::error::red-green-tests: no merge base of origin/main and HEAD"; exit 3; }
          # 0 ok, 1 refused, 3 could not judge; anything but 0 fails the job.
          "$RUNNER_TEMP/redgreen" "$base" HEAD
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Go's module and build caches, keyed on every module's go.sum (there is none at the root).
          # Test results never come from it: make ci runs go test with -count=1.
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: make ci
