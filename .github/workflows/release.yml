# Placket's releases (docs/release.md). Landed and changed only by the maintainer's merge.
#
# release  (pushes to main): when the push is a release PR's merge, `scripts/release-detect.sh` says so.
#          The job runs `make ci`, tags the commit vX.Y.Z, builds and signs with GoReleaser into a
#          draft release, adds GitHub's build provenance, and publishes the draft. Any other push ends
#          after the detect step. A run that failed partway is re-run as it stands and resumes at the
#          build: the tag is there and the release is missing or a draft.
# dry-run  (pull requests): builds a snapshot twice without signing, checks that the archives are the
#          same bytes, and runs `scripts/release-check.sh --snapshot` on it. Not a required check.
#
# Neither job is required, so the `if:` that picks each one's event is safe: a skipped job here gates
# nothing. All of `release` is one job, because a tag pushed with the workflow's own token starts no
# other workflow. There is no `concurrency:` group, so no pending run is dropped; two runs racing for
# one tag both try to push it, and the second push is refused. Signing and provenance use only the
# job's OIDC token: no secret, and never pull_request_target.
#
# Pins: every action by its full commit, and GoReleaser, cosign and syft by version. A change to any of
# them may change the archives' bytes, so it lands in a pull request of its own. Go comes from go.mod's
# toolchain line, which must change together with loom.yml's GO_VERSION.
name: release
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
env:
  GORELEASER_VERSION: v2.19.0
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: v1.55.0
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE: ${{ github.event.before }}
      PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The whole history and every tag: release-detect reads both, and Go stamps the version
          # from the tag at the commit.
          fetch-depth: 0
          fetch-tags: true
      - name: Is this push a release?
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git tag --points-at "$GITHUB_SHA" 'v*' | head -n 1)
          state=none
          if [ -n "$tag" ]; then
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view.err"); then
              if [ "$draft" = true ]; then state=draft; else state=published; fi
            elif grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
              state=none
            else
              cat "$RUNNER_TEMP/view.err"
              echo "::error::release: cannot read the release of $tag"
              exit 1
            fi
          fi
          set --
          if [ "$PRIVATE" = true ]; then set -- --private; fi
          # A refusal prints its reason and exits 1, which fails the job here.
          result=$(scripts/release-detect.sh --before "$BEFORE" --after "$GITHUB_SHA" \
            --today "$(date -u +%Y-%m-%d)" --release-state "$state" --notes "$RUNNER_TEMP/notes.md" "$@")
          echo "$result"
          case $result in
            "release "*) echo "kind=release" >>"$GITHUB_OUTPUT"; echo "version=${result#release }" >>"$GITHUB_OUTPUT" ;;
            "resume "*) echo "kind=resume" >>"$GITHUB_OUTPUT"; echo "version=${result#resume }" >>"$GITHUB_OUTPUT" ;;
            "not a release push") echo "kind=none" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::release: release-detect printed an unknown result"; exit 1 ;;
          esac
      - if: steps.detect.outputs.kind != 'none'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # No build cache: a release is built from nothing but the tree and the pinned tools.
          cache: false
      - name: make ci at the commit
        if: steps.detect.outputs.kind == 'release'
        run: make ci
      - name: Tag the commit
        if: steps.detect.outputs.kind == 'release'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "placket v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: The tree is clean
        if: steps.detect.outputs.kind != 'none'
        run: |
          # Anything not committed and not ignored makes Go stamp +dirty, and GoReleaser refuses it.
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "::error::release: the tree is not clean"; exit 1; fi
      - if: steps.detect.outputs.kind != 'none'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - if: steps.detect.outputs.kind != 'none'
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - if: steps.detect.outputs.kind != 'none'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >>"$GITHUB_PATH"
      - name: Build, sign and upload a draft release
        if: steps.detect.outputs.kind != 'none'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The release's own tag, named: the core's tags (core/vX.Y.Z) can sit on the same commit,
          # and GoReleaser would otherwise take whichever tag sorts first as the version.
          GORELEASER_CURRENT_TAG: v${{ steps.detect.outputs.version }}
      - name: Build provenance for every archive and checksums.txt
        if: steps.detect.outputs.kind != 'none'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish the draft
        if: steps.detect.outputs.kind != 'none'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >>"$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: The config is valid (B1)
        run: goreleaser check
      - name: A snapshot builds the same archives twice (B2, B3)
        run: |
          set -eu
          # The version is the newest vX.Y.Z tag, or v0.0.0 before the first release: never a core
          # tag (core/vX.Y.Z), whose slash would put every archive one directory down.
          GORELEASER_CURRENT_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          export GORELEASER_CURRENT_TAG
          goreleaser release --snapshot --clean --skip=sign
          grep '\.tar\.gz$' dist/checksums.txt >"$RUNNER_TEMP/first.txt"
          goreleaser release --snapshot --clean --skip=sign
          grep '\.tar\.gz$' dist/checksums.txt >"$RUNNER_TEMP/second.txt"
          if ! cmp -s "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"; then
            diff "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt" || true
            echo "::error::release: two snapshot builds of one commit gave different archives"
            exit 1
          fi
      - name: The release check holds on the snapshot (B4)
        run: scripts/release-check.sh --snapshot dist
