# GoReleaser v2: what a placket release holds and how it is built (docs/release.md).
#
# The archives are reproducible: a rebuild at the tag gives the same bytes. Nothing is stamped at link
# time; placket version reads the version Go stamps from the git state, and every time inside an
# archive is the commit's. The SBOMs carry their own creation time, so they are signed, through
# checksums.txt, but not reproducible.
version: 2

project_name: placket

builds:
  - id: placket
    main: ./cmd/placket
    binary: placket
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Set explicitly: GoReleaser's default ldflags add -X main.version and main.date, which change
    # the bytes and are not how placket names its version.
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: placket
    ids:
      - placket
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
      mode: 0755
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
          owner: root
          group: root
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
          owner: root
          group: root
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
          mode: 0644
          owner: root
          group: root

sboms:
  - id: placket
    artifacts: archive
    cmd: syft
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

# install.sh, the one-line install (docs/release.md), is a release asset with its line in
# checksums.txt, so the signature covers it.
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: install.sh

# cosign signs checksums.txt keyless, with the release workflow's OIDC identity, into a bundle.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      # The Sigstore bundle format, which cosign 3 writes by default and cosign 2 only with this flag.
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

# The Homebrew cask, for macOS and Linux, from the archives at their checksums. GoReleaser writes it
# to dist/homebrew/Casks/placket.rb after checksums.txt is signed, and pushes it nowhere: the release
# attaches it, and the tap's own workflow takes it from the published release (docs/release.md).
homebrew_casks:
  - name: placket
    ids:
      - placket
    binaries:
      - placket
    homepage: https://github.com/orilloai/placket
    description: Mediates content crossing between parties and signs a receipt for every decision
    license: Apache-2.0
    directory: Casks
    repository:
      owner: orilloai
      name: homebrew-tap
    skip_upload: true
    # The binary is not notarized: without the quarantine mark, its first run on macOS asks nothing.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/placket"]
          end

# The notes are the version's CHANGELOG.md section, given with --release-notes.
changelog:
  disable: true

release:
  github:
    owner: orilloai
    name: placket
  # A draft, published by the workflow once every asset and attestation is in; a run that resumes
  # replaces the draft an earlier run left.
  draft: true
  replace_existing_draft: true
  # install.sh, and the cask GoReleaser wrote. The cask is in no line of checksums.txt: its SHA-256s
  # are the archives' lines there.
  extra_files:
    - glob: install.sh
    - glob: dist/homebrew/Casks/placket.rb
